<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self'" />
		<title>WikiMasters Plus</title>
		<link rel="stylesheet" href="./style.css" />
	</head>
	<body>
		<header class="popup-header">
			<h1>WikiMasters Plus</h1>
		</header>
		<section class="popup-section" aria-labelledby="packs-title">
			<div class="section-head">
				<h2 id="packs-title">Paquets</h2>
				<button type="button" class="link-button" id="open-pulls">Ouvrir</button>
			</div>
			<p class="pack-stock" id="pack-stock"></p>
			<p class="muted" id="pack-detail"></p>
		</section>
		<section class="popup-section" aria-labelledby="auctions-title">
			<div class="section-head">
				<h2 id="auctions-title">Enchères suivies</h2>
				<button type="button" class="link-button" id="open-market">Marché</button>
			</div>
			<ul class="auction-list" id="auction-list"></ul>
			<p class="muted" id="auction-empty" hidden>
				Aucune enchère suivie. Clique sur « Suivre » sous une enchère du marché, ou mise : tes enchères sont suivies
				automatiquement.
			</p>
		</section>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
